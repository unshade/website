worker_processes  1;

events {
  worker_connections  1024;
}

http {
  server {
    listen 8080;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 404 /404.html;
    location = /404.html {
            root /usr/share/nginx/html;
            internal;
    }

    # Redirects keep the client's host and scheme (the container sits behind
    # a proxy on :8080, which must not leak into Location headers).
    absolute_redirect off;

    # One URL per page: /blog -> 301 -> /blog/, matching canonicals and the
    # sitemap. nginx adds the slash itself when $uri/ is a directory.
    location / {
            try_files $uri $uri/ =404;
    }

    # The old placeholder "Terms" page became the legal notice.
    location ~ ^/(fr/)?legal/terms/?$ {
            return 301 /$1legal/notice/;
    }

    # Astro's build output is content-hashed, so it never changes in place.
    location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
            add_header Cache-Control "public, max-age=2592000";
    }

    location /gpx/ {
            add_header Cache-Control "public, max-age=86400";
    }
  }
}